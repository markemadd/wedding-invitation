# XcodeGen project specification for Mizan.
#
# Why XcodeGen instead of a hand-managed .xcodeproj:
# the project file is generated from this readable YAML, so target settings,
# package references, and build phases are reviewable in plain text instead of
# buried in pbxproj noise. Regenerate after editing with:  xcodegen generate
#
# The generated Mizan.xcodeproj is still committed to git so the project opens
# in Xcode without any extra tooling — this file is simply the source of truth.
name: Mizan

options:
  bundleIdPrefix: com.markemad
  deploymentTarget:
    iOS: "17.0" # Blueprint Phase 0: iOS 17 minimum, needed for latest Swift Charts APIs and MLX Swift.
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Xcode 15+ sandboxes run-script phases by default, which blocks SwiftLint
    # from reading source files. Disabling it is safe here: the only script
    # phase is our own lint step, no third-party scripts run at build time.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

# Local Swift packages — the module layout from blueprint Section 4.
# One package per module keeps each independently testable and keeps the app
# target from becoming a monolith. Note: the blueprint calls the security
# module "Security", but a Swift module named Security would shadow Apple's
# Security.framework (which Phase 1's Keychain code must import), so the
# package is named MizanSecurity instead.
packages:
  Persistence: { path: Packages/Persistence }
  MizanSecurity: { path: Packages/MizanSecurity }
  Capture: { path: Packages/Capture }
  Budgeting: { path: Packages/Budgeting }
  SavingsAndGoals: { path: Packages/SavingsAndGoals }
  Forecasting: { path: Packages/Forecasting }
  LLM: { path: Packages/LLM }
  UI: { path: Packages/UI }

# One scheme runs the app AND every package's test bundle, so
# `xcodebuild test -scheme Mizan` exercises the whole module graph — each
# phase's testing checkpoint runs through this single entry point.
schemes:
  Mizan:
    build:
      targets:
        Mizan: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - package: Persistence/PersistenceTests
        - package: MizanSecurity/MizanSecurityTests
        - package: Capture/CaptureTests
        - package: Budgeting/BudgetingTests
        - package: SavingsAndGoals/SavingsAndGoalsTests
        - package: Forecasting/ForecastingTests
        - package: LLM/LLMTests
        - package: UI/UITests

targets:
  Mizan:
    type: application
    platform: iOS
    sources:
      - App
      - Shared # WidgetSnapshot model+store, compiled into app AND widget extension.
    dependencies:
      - package: Persistence
      - package: MizanSecurity
      - package: Capture
      - package: Budgeting
      - package: SavingsAndGoals
      - package: Forecasting
      - package: LLM
      - package: UI
      - target: MizanWidgets
        embed: true
    # App Group shared with the widget extension — carries ONLY the derived
    # WidgetSnapshot (safe-to-spend aggregates), per the PendingCaptureQueue
    # pattern: widgets run outside the Face-ID-gated session.
    entitlements:
      path: App/Mizan.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.markemad.mizan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markemad.mizan # com.mizan.app is taken globally — Apple refused to register it to this team.
        DEVELOPMENT_TEAM: 5N9MK9XFWG # Personal team, set here so `xcodegen generate` never wipes the signing setup.
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1" # iPhone only — this is a personal iPhone app.
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        # Appearance is NO LONGER forced dark here — the app now supports a
        # System/Light/Dark preference (Settings), applied via
        # .preferredColorScheme at RootView. That was previously avoided
        # because it perturbed the scenePhase-driven privacy shield; the
        # shield now runs off UIKit willResignActive/didBecomeActive
        # notifications instead, so the color-scheme modifier is safe.
        # Required for Phase 1's biometric gate; declared now so the
        # entitlement story never blocks a later phase's build.
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Mizan uses Face ID to unlock your encrypted financial data."
        # Phase 2 voice capture — recording stays on-device end to end
        # (SFSpeechRecognizer runs with requiresOnDeviceRecognition).
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Mizan records your voice only to transcribe a transaction, entirely on-device."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Mizan transcribes your spoken transactions on-device; audio never leaves your iPhone."
        INFOPLIST_KEY_NSCameraUsageDescription: "Mizan photographs receipts only to read them on-device; photos are not saved or uploaded."
        # Local-network permission prompt copy for the opt-in "use my AI
        # server" feature (Mizan AI talking to a model on the user's own Mac).
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Mizan connects to the AI server you run on your own computer, over your local network — only when you turn on 'Use my AI server'."
    # A base Info.plist carrying the App Transport Security exception that
    # lets Mizan reach a plain-HTTP model server (Ollama / LM Studio) on the
    # LOCAL network only. NSAllowsLocalNetworking permits cleartext to
    # link-local / private-range hosts without opening arbitrary internet
    # loads. GENERATE_INFOPLIST_FILE stays on and merges its keys over this.
    info:
      path: App/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Export compliance: Mizan bundles SQLCipher (AES) for data-at-rest,
        # which is non-exempt encryption, so this is YES. It qualifies for the
        # standard-cryptography exemption (mass-market, no proprietary crypto);
        # answer the App Store Connect questions accordingly. See PRIVACY.md.
        ITSAppUsesNonExemptEncryption: true
    postCompileScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          # Blueprint Phase 0 task 6: SwiftLint as a build phase to catch style drift early.
          # Homebrew's bin dirs aren't on Xcode's PATH, so add them explicitly.
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint --config "${SRCROOT}/.swiftlint.yml"
          else
            echo "warning: SwiftLint is not installed — run: brew install swiftlint"
          fi

  # Home/Lock Screen widgets ("safe to spend today"). Reads only the derived
  # WidgetSnapshot from the App Group — never links Persistence, so the
  # extension physically cannot open the encrypted database.
  MizanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    entitlements:
      path: Widgets/MizanWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.markemad.mizan
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Mizan
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markemad.mizan.widgets # Must be prefixed by the app's bundle id.
        DEVELOPMENT_TEAM: 5N9MK9XFWG
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
